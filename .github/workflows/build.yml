
name: MYRA AI 2.0 Cloud Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract ZIP Files
        run: |
          mkdir extracted
          find . -maxdepth 1 -name '*.zip' -print0 |
          while IFS= read -r -d '' f; do
            unzip -o "$f" -d extracted
          done

      - name: Find Android Project
        run: |
          PROJECT=$(find extracted \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> $GITHUB_ENV

      - name: Fix Accessibility XML
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          base = Path("extracted/myra_project/app/src/main")
          xml = base / "res/xml/accessibility_service_config.xml"

          if not xml.exists():
              xml = next(Path("extracted").rglob("accessibility_service_config.xml"))

          content = xml.read_text()
          content = re.sub(
              r'android:description\s*=\s*["\'][^"\']*["\']',
              'android:description="@string/accessibility_service_description"',
              content
          )
          xml.write_text(content)

          values = xml.parents[1] / "values"
          values.mkdir(parents=True, exist_ok=True)
          strings = values / "strings.xml"

          if strings.exists():
              text = strings.read_text()
          else:
              text = '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'

          entry = '<string name="accessibility_service_description">MYRA screen actions (user enabled)</string>'

          if 'name="accessibility_service_description"' not in text:
              text = text.replace('</resources>', '    ' + entry + '\n</resources>')

          strings.write_text(text)
          print("Accessibility XML fixed successfully")
          PY

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-AI-2.0-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
