name: MYRA AI 2.0 Cloud Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Fixed Merged Project
        run: |
          test -f MYRA_AI_2.0_FIXED_MERGED.zip
          mkdir -p extracted
          unzip -o MYRA_AI_2.0_FIXED_MERGED.zip -d extracted

      - name: Find Android Project
        run: |
          PROJECT=$(find extracted -name settings.gradle.kts -o -name settings.gradle | head -1)
          test -n "$PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRA-AI-2.0-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
